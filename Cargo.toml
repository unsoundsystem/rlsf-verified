[package]
name = "rlsf-verified"
version = "0.1.0"
edition = "2018" #"2024"
license = "MIT"

[dependencies]
vstd = { git = "https://github.com/verus-lang/verus.git" }
perf_probe = { path = "perf_probe", optional = true }

[features]
default = []
std = []
# Feature for benches/microbench only. Compiles in rdpmc-based perf probes
# inside link_free_block. Verified builds must NOT enable this; the verus
# proofs depend on the cfg-gated probe code being absent.
rdpmc-bench = ["std", "dep:perf_probe"]

[dev-dependencies]
